<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ryd app-cache · Claes' privatøkonomi</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f3f6ef; color: #10231d; }
    main { max-width: 680px; padding: 32px; border: 1px solid rgba(16,35,29,.13); border-radius: 28px; background: rgba(255,250,241,.9); box-shadow: 0 22px 70px rgba(25,29,27,.08); }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 4rem); line-height: .95; letter-spacing: -.06em; }
    p { color: #64746c; line-height: 1.55; }
    .status { margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: rgba(0,122,83,.08); color: #00573f; font-weight: 800; }
    a, button { color: #fffaf1; background: #00573f; border: 0; border-radius: 999px; padding: 11px 16px; font-weight: 800; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Rydder gammel app-cache</h1>
    <p>Jeg afmelder service worker og sletter cached PWA-filer, så den nyeste Bank-sync vises.</p>
    <p class="status" id="status">Starter…</p>
    <p><button id="again" type="button">Ryd igen og åbn app</button></p>
  </main>
  <script>
    async function reset() {
      const status = document.getElementById('status');
      try {
        status.textContent = 'Afmelder service worker…';
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        status.textContent = 'Sletter caches…';
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        status.textContent = 'Færdig — åbner nyeste app…';
        window.setTimeout(() => {
          window.location.replace('/?fresh=' + Date.now() + '#bank-sync');
        }, 800);
      } catch (error) {
        status.textContent = 'Kunne ikke rydde automatisk: ' + error.message;
      }
    }
    document.getElementById('again').addEventListener('click', reset);
    reset();
  </script>
</body>
</html>
