<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lokal data-status · Claes' privatøkonomi</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f3f6ef; color:#10231d; }
    main { max-width:860px; width:calc(100% - 40px); padding:32px; border:1px solid rgba(16,35,29,.13); border-radius:28px; background:rgba(255,250,241,.92); box-shadow:0 22px 70px rgba(25,29,27,.08); }
    h1 { margin:0 0 12px; font-size:clamp(2rem,6vw,4rem); line-height:.95; letter-spacing:-.06em; }
    p, li { color:#64746c; line-height:1.55; }
    .box { margin-top:18px; padding:14px 16px; border-radius:16px; background:rgba(0,122,83,.08); color:#00573f; font-weight:800; white-space:pre-wrap; }
    a, button { display:inline-flex; margin:8px 8px 0 0; color:#fffaf1; background:#00573f; border:0; border-radius:999px; padding:11px 16px; font-weight:800; text-decoration:none; cursor:pointer; }
    .ghost { background:transparent; color:#00573f; border:1px solid rgba(16,35,29,.16); }
    table { width:100%; border-collapse:collapse; margin-top:18px; font-size:.9rem; }
    td, th { padding:8px; border-bottom:1px solid rgba(16,35,29,.12); text-align:left; }
  </style>
</head>
<body>
  <main>
    <h1>Lokal data-status</h1>
    <p>Denne side viser, hvad der faktisk ligger i browserens <code>localStorage</code> for appen.</p>
    <div id="summary" class="box">Læser…</div>
    <p>
      <a href="/pull-enablebanking.html?from=2026-04-01&stay=1">Træk bankdata ind i denne browser</a>
      <a class="ghost" href="/?fresh=1#transaktioner">Åbn transaktioner</a>
      <a class="ghost" href="/?fresh=1#oprydning">Åbn oprydning</a>
    </p>
    <div id="rows"></div>
  </main>
<script>
function fmt(n){ return new Intl.NumberFormat('da-DK',{style:'currency',currency:'DKK'}).format(Number(n||0)); }
function run(){
  const raw=localStorage.getItem('finansblik:v1');
  const summary=document.getElementById('summary');
  if(!raw){ summary.textContent='Ingen app-data fundet i denne browser endnu.'; return; }
  const s=JSON.parse(raw);
  const tx=s.transactions||[];
  const eb=tx.filter(t=>String(t.source||'').includes('enablebanking'));
  const accounts=s.accounts||[];
  summary.textContent=`Konti i appen: ${accounts.length}\nPosteringer i appen: ${tx.length}\nEnable Banking-posteringer: ${eb.length}\nValgt måned: ${s.settings?.selectedMonth||'ukendt'}`;
  const latest=tx.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,20);
  document.getElementById('rows').innerHTML=`<table><thead><tr><th>Dato</th><th>Tekst</th><th>Beløb</th><th>Kilde</th></tr></thead><tbody>${latest.map(t=>`<tr><td>${t.date||''}</td><td>${String(t.description||'').slice(0,90)}</td><td>${fmt(t.amount)}</td><td>${t.source||''}</td></tr>`).join('')}</tbody></table>`;
}
run();
</script>
</body>
</html>
