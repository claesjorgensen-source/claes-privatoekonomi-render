<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log ind · Claes' privatøkonomi</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(460px, 100%); border: 1px solid var(--line); border-radius: 32px; background: rgba(255,250,241,.9); padding: 32px; box-shadow: var(--shadow); }
    .login-card h1 { font-size: clamp(2.5rem, 10vw, 4.7rem); }
    .login-card p { color: var(--muted); line-height: 1.55; }
    .login-card form { display: grid; gap: 16px; margin-top: 22px; }
    .login-error { display:none; color: var(--danger); font-weight: 800; }
  </style>
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">Privat adgang</p>
    <h1>Log ind</h1>
    <p>Adgang til Claes' privatøkonomi er beskyttet, når appen kører som webapp.</p>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="password">Adgangskode</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" autofocus required />
      </div>
      <button class="button primary" type="submit">Åbn app</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/';
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('login-error');
      error.style.display = 'none';
      try {
        const password = new FormData(event.target).get('password');
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || 'Login fejlede');
        location.replace(next);
      } catch (err) {
        error.textContent = err.message;
        error.style.display = 'block';
      }
    });
  </script>
</body>
</html>
