<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sender tilbage · Claes' privatøkonomi</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f3f6ef; color: #10231d; }
    main { max-width: 620px; padding: 32px; border: 1px solid rgba(16,35,29,.13); border-radius: 28px; background: rgba(255,250,241,.88); box-shadow: 0 22px 70px rgba(25,29,27,.08); }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 6vw, 4rem); line-height: .95; letter-spacing: -.06em; }
    p { color: #64746c; line-height: 1.55; }
    a { color: #00573f; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <h1>Sender dig tilbage</h1>
    <p>Enable Banking-samtykket er modtaget. Du sendes tilbage til den lokale privatøkonomi-app på din Mac.</p>
    <p>Hvis det ikke sker automatisk, <a id="fallback" href="http://localhost:5173/">klik her</a>.</p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    params.set("enablebanking", "connected");
    const localUrl = `http://localhost:5173/?${params.toString()}`;
    document.getElementById("fallback").href = localUrl;
    window.setTimeout(() => window.location.replace(localUrl), 350);
  </script>
</body>
</html>
